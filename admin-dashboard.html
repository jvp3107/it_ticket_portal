<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Queue | Spread Technical</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body class="flex flex-col min-h-screen font-sans antialiased">
    
    <!-- TICKET MODAL (Only needed on this page) -->
    <div id="ticketModalOverlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[100] hidden flex items-center justify-center p-4 transition-opacity opacity-0 duration-300">
        <div id="ticketModal" class="glass-panel w-full max-w-5xl max-h-[90vh] rounded-[32px] flex flex-col overflow-hidden transform scale-95 transition-transform duration-300">
            <div class="flex justify-between items-center p-6 border-b border-slate-200 glass-surface bg-white/80">
                <div class="w-full">
                    <h3 class="font-extrabold text-2xl text-blue-600 mb-1" id="modalRequesterName">User Name</h3>
                    <div class="flex items-center gap-3 text-xs font-bold text-slate-500 uppercase tracking-wider">
                        <span id="modalTicketId" class="text-slate-700 bg-slate-100 px-2 py-0.5 rounded border border-slate-200">INC-000000</span> &bull; <span id="modalTicketDate">Date</span>
                    </div>
                </div>
                <button onclick="closeTicketModal()" class="w-10 h-10 rounded-full glass-surface hover:bg-rose-100 hover:text-rose-600 flex items-center justify-center text-slate-500 transition-colors flex-shrink-0"><i class="fa-solid fa-times text-xl"></i></button>
            </div>
            <div class="flex-grow overflow-hidden flex flex-col lg:flex-row bg-white">
                <div class="w-full lg:w-3/5 p-6 overflow-y-auto border-r border-slate-200" id="modalTicketDetails">
                    <div class="mb-8"><p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-3">Ticket Lifecycle</p><div class="flex items-center" id="modalPipeline"></div></div>
                    <div class="mb-6 border-b border-slate-200 pb-6">
                        <h4 class="text-sm font-bold text-slate-800 mb-3">Subject: <span class="font-normal text-slate-600" id="modalSubject">Subject</span></h4>
                        <div class="flex flex-wrap gap-2 mb-4" id="modalBadges"></div>
                        <div class="glass-surface p-5 rounded-2xl bg-slate-50 border border-slate-200"><p class="text-xs text-slate-700 whitespace-pre-wrap leading-relaxed" id="modalDescription"></p></div>
                        <div id="modalAttachmentContainer" class="mt-4"></div>
                        <div id="modalRemoteContainer"></div>
                    </div>
                    <div class="grid grid-cols-2 gap-4 glass-surface p-4 rounded-2xl bg-slate-50 border border-slate-200">
                        <div><p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Requester Contact</p><p class="text-xs text-slate-700 font-medium" id="modalRequesterContact"></p></div>
                        <div><p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">IT Assignment</p><p class="text-xs font-bold text-emerald-600" id="modalAssignment"></p><p class="text-[10px] text-slate-500" id="modalAssignDate"></p></div>
                    </div>
                </div>
                <div class="w-full lg:w-2/5 flex flex-col bg-slate-50 h-[50vh] lg:h-auto relative">
                    <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-white absolute top-0 w-full z-10 shadow-sm"><h4 class="font-bold text-sm text-slate-600 uppercase tracking-wider flex items-center"><i class="fa-brands fa-whatsapp mr-2 text-emerald-500 text-lg"></i> Live Chat</h4></div>
                    <div id="modalChatHistory" class="flex-grow overflow-y-auto p-4 pt-16 flex flex-col scroll-smooth chat-bg pb-20"></div>
                    <div class="p-4 glass-surface border-t border-slate-200 bg-white absolute bottom-0 w-full z-10 shadow-lg">
                        <div class="flex gap-2 relative">
                            <input type="hidden" id="modalActiveTicketId">
                            <input type="text" id="modalChatInput" onkeypress="if(event.key === 'Enter') postModalChatMessage()" class="flex-grow px-5 py-3 text-sm border border-slate-300 bg-white rounded-full outline-none focus:border-blue-500 text-slate-800 transition-colors shadow-inner" placeholder="Type a message...">
                            <button onclick="postModalChatMessage()" id="modalChatSendBtn" class="bg-blue-600 text-white w-12 h-12 rounded-full flex items-center justify-center hover:bg-blue-500 transition-colors shadow-md active:scale-95 flex-shrink-0"><i class="fa-solid fa-paper-plane text-sm"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- GLOBAL HEADER -->
    <header class="glass-header sticky top-0 z-40 shadow-sm">
        <div class="max-w-[1600px] mx-auto px-4 h-20 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 bg-blue-600 text-white rounded-xl flex items-center justify-center text-xl shadow-md border border-blue-500/50"><i class="fa-solid fa-layer-group"></i></div>
                <div class="border-l-2 border-slate-300 pl-4">
                    <h1 class="text-xl font-black text-slate-800 tracking-tight">SPREAD TECHNICAL</h1>
                    <p class="text-[10px] font-bold text-slate-500 uppercase tracking-[0.2em]">IT Service Management</p>
                </div>
            </div>
            <button onclick="logoutGlobal()" id="globalLogoutBtn" class="bg-rose-50 border border-rose-200 text-rose-600 px-5 py-2.5 rounded-full text-sm font-bold hover:bg-rose-100 transition-all flex items-center gap-2 shadow-sm hidden"><i class="fa-solid fa-arrow-right-from-bracket"></i> Sign Out</button>
        </div>
    </header>

    <main class="flex-grow max-w-[1500px] mx-auto px-4 py-8 w-full relative z-10">
        
        <!-- Navigation Tabs -->
        <div class="admin-nav-container mb-10 mx-auto w-fit text-center overflow-x-auto max-w-full bg-white/90">
            <button onclick="switchNocTab('all')" id="nocTab-all" class="ent-tab-btn ent-tab-active whitespace-nowrap"><i class="fa-solid fa-layer-group"></i> Global Queue</button>
            <button onclick="switchNocTab('visits')" id="nocTab-visits" class="ent-tab-btn ent-tab-inactive whitespace-nowrap"><i class="fa-solid fa-map-location-dot"></i> Field Visits</button>
            <button onclick="switchNocTab('inventory')" id="nocTab-inventory" class="ent-tab-btn ent-tab-inactive whitespace-nowrap"><i class="fa-solid fa-boxes-stacked"></i> Asset Inventory</button>
            <button onclick="switchNocTab('analytics')" id="nocTab-analytics" class="ent-tab-btn ent-tab-inactive whitespace-nowrap"><i class="fa-solid fa-chart-pie"></i> Analytics & Exports</button>
            <button onclick="switchNocTab('admin')" id="nocTab-admin" class="ent-tab-btn ent-tab-inactive whitespace-nowrap"><i class="fa-solid fa-users-gear"></i> Admin Management</button>
        </div>

        <!-- KPI Cards -->
        <div class="grid grid-cols-2 lg:grid-cols-6 gap-6 mb-8">
            <div class="glass-panel p-6 rounded-[32px] flex flex-col justify-between relative overflow-hidden transition-all duration-300 hover:shadow-md hover:-translate-y-1 bg-blue-50 border-blue-100 border cursor-pointer" onclick="setQuickFilter('All')"><div class="absolute -right-2 -top-2 opacity-20 text-7xl text-blue-300"><i class="fa-solid fa-layer-group"></i></div><p class="text-xs font-black uppercase tracking-widest mb-1 text-blue-500">Total</p><h3 class="text-4xl font-black text-blue-700" id="kpiTotal">0</h3></div>
            <div class="glass-panel p-6 rounded-[32px] flex flex-col justify-between relative overflow-hidden transition-all duration-300 hover:shadow-md hover:-translate-y-1 bg-violet-50 border-violet-100 border cursor-pointer" onclick="setQuickFilter('Unassigned')"><div class="absolute -right-2 -top-2 opacity-20 text-7xl text-violet-300"><i class="fa-solid fa-user-slash"></i></div><p class="text-xs font-black uppercase tracking-widest mb-1 text-violet-500">Unassigned</p><h3 class="text-4xl font-black text-violet-700" id="kpiUnassigned">0</h3></div>
            <div class="glass-panel p-6 rounded-[32px] flex flex-col justify-between relative overflow-hidden transition-all duration-300 hover:shadow-md hover:-translate-y-1 bg-amber-50 border-amber-100 border cursor-pointer" onclick="setQuickFilter('Pending Approval')"><div class="absolute -right-2 -top-2 opacity-20 text-7xl text-amber-300"><i class="fa-solid fa-clock"></i></div><p class="text-xs font-black uppercase tracking-widest mb-1 text-amber-600">Pending</p><h3 class="text-4xl font-black text-amber-700" id="kpiOpen">0</h3></div>
            <div class="glass-panel p-6 rounded-[32px] flex flex-col justify-between relative overflow-hidden transition-all duration-300 hover:shadow-md hover:-translate-y-1 bg-cyan-50 border-cyan-100 border cursor-pointer" onclick="setQuickFilter('Assigned')"><div class="absolute -right-2 -top-2 opacity-20 text-7xl text-cyan-300"><i class="fa-solid fa-user-check"></i></div><p class="text-xs font-black uppercase tracking-widest mb-1 text-cyan-600">Assigned</p><h3 class="text-4xl font-black text-cyan-700" id="kpiAssigned">0</h3></div>
            <div class="glass-panel p-6 rounded-[32px] flex flex-col justify-between relative overflow-hidden transition-all duration-300 hover:shadow-md hover:-translate-y-1 bg-purple-50 border-purple-100 border cursor-pointer" onclick="setQuickFilter('Working')"><div class="absolute -right-2 -top-2 opacity-20 text-7xl text-purple-300"><i class="fa-solid fa-gears"></i></div><p class="text-xs font-black uppercase tracking-widest mb-1 text-purple-500">Working</p><h3 class="text-4xl font-black text-purple-700" id="kpiWorking">0</h3></div>
            <div class="glass-panel p-6 rounded-[32px] flex flex-col justify-between relative overflow-hidden transition-all duration-300 hover:shadow-md hover:-translate-y-1 bg-emerald-50 border-emerald-100 border cursor-pointer" onclick="setQuickFilter('Resolved')"><div class="absolute -right-2 -top-2 opacity-20 text-7xl text-emerald-300"><i class="fa-solid fa-check-double"></i></div><p class="text-xs font-black uppercase tracking-widest mb-1 text-emerald-600">Resolved</p><h3 class="text-4xl font-black text-emerald-700" id="kpiResolved">0</h3></div>
        </div>

        <!-- Main Queue Table -->
        <div class="glass-panel rounded-[32px] shadow-sm overflow-hidden border border-slate-200 bg-white">
            <div class="bg-white p-6 flex flex-col xl:flex-row justify-between items-start xl:items-center gap-4 border-b border-slate-200">
                <div class="flex items-center" id="queueHeaderActions"><h2 class="text-2xl font-black text-slate-800"><i class="fa-solid fa-list-check text-blue-600 mr-3"></i> IT Master Queue</h2></div>
                <div class="flex flex-wrap items-center gap-3">
                    <div class="relative"><i class="fa-solid fa-search absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400"></i><input type="text" id="dashSearch" onkeyup="filterDashboard()" class="pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-full text-sm font-medium outline-none w-56 focus:w-72 transition-all focus:border-blue-400 shadow-inner text-slate-800 placeholder-slate-400" placeholder="Search ID or Name..."></div>
                    <select id="dashStatusFilter" onchange="filterDashboard()" class="py-3 px-6 bg-slate-50 border border-slate-200 rounded-full text-sm font-bold outline-none cursor-pointer hover:bg-slate-100 transition shadow-sm text-slate-700"><option value="All">All Statuses</option><option value="Unassigned">Unassigned</option><option value="Pending Approval">Pending Approval</option><option value="Monitoring">Monitoring</option><option value="Assigned">Assigned</option><option value="Working">Working</option><option value="Resolved">Resolved</option></select>
                    <button onclick="fetchDashboardTickets()" class="w-11 h-11 bg-slate-50 border border-slate-200 rounded-full flex items-center justify-center hover:bg-slate-100 transition active:scale-95 shadow-sm text-slate-600" title="Refresh Queue"><i class="fa-solid fa-rotate"></i></button>
                    <button onclick="exportGlobalQueueExcel()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-3 rounded-full text-sm font-black transition flex items-center gap-2 shadow-md active:scale-95 border border-emerald-500"><i class="fa-solid fa-file-excel"></i> Export</button>
                </div>
            </div>
            
            <div class="p-3 bg-slate-50 flex gap-3 border-b border-slate-200"><button onclick="bulkDeleteTickets()" class="px-5 py-2 bg-rose-100 text-rose-600 hover:bg-rose-200 hover:text-rose-700 border border-rose-200 text-xs font-black rounded-lg transition shadow-sm"><i class="fa-solid fa-trash mr-2"></i> Delete Selected</button></div>
            
            <div class="overflow-x-auto min-h-[500px] max-h-[800px] relative bg-white">
                <table class="w-full text-left text-sm border-collapse" id="dashboardTable">
                    <thead class="table-header-custom">
                        <tr class="text-slate-500 text-[10px] font-black uppercase tracking-widest">
                            <th class="px-5 py-5 w-12 text-center cursor-default"><input type="checkbox" id="selectAllCheckbox" onclick="toggleAllCheckboxes(this)" class="w-4 h-4 cursor-pointer accent-blue-600"></th>
                            <th class="px-5 py-5 group" onclick="sortTable('id')">Ticket ID <i id="sortIcon_id" class="fa-solid fa-sort sort-icon"></i></th>
                            <th class="px-6 py-5 group" onclick="sortTable('date')">SLA Engine <i id="sortIcon_date" class="fa-solid fa-sort sort-icon sort-active"></i></th>
                            <th class="px-6 py-5 group" onclick="sortTable('subject')">Incident Details <i id="sortIcon_subject" class="fa-solid fa-sort sort-icon"></i></th>
                            <th class="px-6 py-5 text-center group" onclick="sortTable('status')">Status / Actions <i id="sortIcon_status" class="fa-solid fa-sort sort-icon"></i></th>
                        </tr>
                    </thead>
                    <tbody id="dashboardTableBody" class="divide-y divide-slate-200"></tbody>
                </table>
            </div>
        </div>
    </main>
    <script src="assets/app.js"></script>
</body>
</html>
