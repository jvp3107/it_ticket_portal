<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics | Spread Technical</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/PptxGenJS/libs/pptxgen.bundle.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body class="flex flex-col min-h-screen font-sans antialiased">
    
    <!-- GLOBAL HEADER -->
    <header class="glass-header sticky top-0 z-40 shadow-sm">
        <div class="max-w-[1600px] mx-auto px-4 h-20 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 bg-blue-600 text-white rounded-xl flex items-center justify-center text-xl shadow-md border border-blue-500/50"><i class="fa-solid fa-layer-group"></i></div>
                <div class="border-l-2 border-slate-300 pl-4">
                    <h1 class="text-xl font-black text-slate-800 tracking-tight">SPREAD TECHNICAL</h1>
                    <p class="text-[10px] font-bold text-slate-500 uppercase tracking-[0.2em]">IT Service Management</p>
                </div>
            </div>
            <button onclick="logoutGlobal()" id="globalLogoutBtn" class="bg-rose-50 border border-rose-200 text-rose-600 px-5 py-2.5 rounded-full text-sm font-bold hover:bg-rose-100 transition-all flex items-center gap-2 shadow-sm hidden"><i class="fa-solid fa-arrow-right-from-bracket"></i> Sign Out</button>
        </div>
    </header>

    <main class="flex-grow max-w-[1500px] mx-auto px-4 py-8 w-full relative z-10">
        
        <!-- Navigation Tabs -->
        <div class="admin-nav-container mb-10 mx-auto w-fit text-center overflow-x-auto max-w-full bg-white/90">
            <button onclick="switchNocTab('all')" id="nocTab-all" class="ent-tab-btn ent-tab-inactive whitespace-nowrap"><i class="fa-solid fa-layer-group"></i> Global Queue</button>
            <button onclick="switchNocTab('visits')" id="nocTab-visits" class="ent-tab-btn ent-tab-inactive whitespace-nowrap"><i class="fa-solid fa-map-location-dot"></i> Field Visits</button>
            <button onclick="switchNocTab('inventory')" id="nocTab-inventory" class="ent-tab-btn ent-tab-inactive whitespace-nowrap"><i class="fa-solid fa-boxes-stacked"></i> Asset Inventory</button>
            <button onclick="switchNocTab('analytics')" id="nocTab-analytics" class="ent-tab-btn ent-tab-active whitespace-nowrap"><i class="fa-solid fa-chart-pie"></i> Analytics & Exports</button>
            <button onclick="switchNocTab('admin')" id="nocTab-admin" class="ent-tab-btn ent-tab-inactive whitespace-nowrap"><i class="fa-solid fa-users-gear"></i> Admin Management</button>
        </div>

        <!-- ANALYTICS VIEW -->
        <div id="noc-analyticsView" class="animate-fade-in max-w-6xl mx-auto">
            <div class="mb-10 text-center">
                <h2 class="text-4xl font-black text-slate-800">Analytics & Metrics</h2>
                <p class="text-slate-500 mt-3 font-medium">Platform utilization and company-specific ticketing data.</p>
            </div>

            <!-- Company Metrics Grid -->
            <div class="mb-10">
                <h3 class="font-black text-slate-800 text-xl mb-6 ml-2"><i class="fa-solid fa-building text-blue-600 mr-3"></i> Client Infrastructure Tickets</h3>
                <div id="companyCardsGrid" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6">
                    <!-- Cards injected here -->
                </div>
            </div>

            <!-- Main Chart Panel -->
            <div class="glass-panel rounded-[32px] p-10 mb-10 shadow-md bg-white">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-5">
                    <h3 class="font-black text-slate-800 text-2xl"><i class="fa-solid fa-chart-spline text-blue-600 mr-3"></i> Graphical Analytics</h3>
                    
                    <div class="flex flex-wrap gap-3 p-3 bg-slate-50 border border-slate-200 rounded-2xl w-full md:w-auto shadow-sm">
                        <button onclick="exportFullRawTickets()" class="bg-emerald-600 border border-emerald-500 text-white px-6 py-2.5 rounded-full text-xs font-bold hover:bg-emerald-500 transition shadow-sm active:scale-95 flex items-center gap-2 mr-2">
                            <i class="fa-solid fa-database"></i> Raw Data Export
                        </button>
                        <div class="w-px bg-slate-300"></div>
                        <button onclick="exportChartExcel()" class="bg-white border border-slate-300 text-emerald-600 px-5 py-2.5 rounded-full text-xs font-bold hover:bg-slate-50 transition shadow-sm active:scale-95">
                            <i class="fa-solid fa-chart-pie mr-2"></i> Excel
                        </button>
                        <button onclick="exportChartPPT()" class="bg-white border border-slate-300 text-orange-600 px-5 py-2.5 rounded-full text-xs font-bold hover:bg-slate-50 transition shadow-sm active:scale-95">
                            <i class="fa-solid fa-file-powerpoint mr-2"></i> PPT
                        </button>
                        <button onclick="exportChartPDF()" class="bg-white border border-slate-300 text-rose-600 px-5 py-2.5 rounded-full text-xs font-bold hover:bg-slate-50 transition shadow-sm active:scale-95">
                            <i class="fa-solid fa-file-pdf mr-2"></i> PDF
                        </button>
                    </div>
                </div>
                <div class="w-full h-96 relative bg-slate-50 rounded-2xl p-6 shadow-inner border border-slate-200">
                    <canvas id="monthlyChart"></canvas>
                </div>
            </div>
        </div>
    </main>
    <script src="assets/app.js"></script>
</body>
</html>
